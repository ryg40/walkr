<section class="trainer-gui" id="trainerGui" aria-labelledby="trainerGuiHeading" hidden>
  <h2 id="trainerGuiHeading">Training</h2>
  <p class="trainer-gui-status" id="trainerGuiStatus" role="status" aria-live="polite"></p>
  <p class="trainer-gui-dataset" id="trainerGuiDataset"></p>
  <div class="alert-actions">
    <button type="button" id="trainerGuiResolve" class="btn-ghost" hidden>Resolve saved request</button>
    <button type="button" id="trainerGuiRetry" class="btn-primary" hidden>Retry preparation</button>
    <button type="button" id="trainerGuiSendPending" class="btn-primary" hidden>Send pending requests</button>
    <button type="button" id="trainerGuiEnd" class="btn-ghost" hidden>End Trainer session</button>
  </div>
  <iframe id="trainerGuiFrame" title="Trainer plan review and ranking" referrerpolicy="no-referrer" hidden></iframe>
</section>
